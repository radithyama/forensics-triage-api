name: forensics-triage

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped

services:
  redis:
    image: redis:8-alpine
    <<: *hardening
    user: redis   # run unprivileged so the entrypoint needs none of the dropped capabilities
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]

  api-gateway:
    build: ./api-gateway
    image: forensics/api-gateway:local
    <<: *hardening
    depends_on:
      redis: { condition: service_healthy }
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN in .env}
      ALLOWED_ORIGINS: http://localhost:3000
      MAX_UPLOAD_SIZE: 8GB
    volumes:
      - uploads:/data
    networks: [backend, frontend]

  forensic-worker:
    build: ./forensic-worker
    image: forensics/forensic-worker:local
    <<: *hardening
    depends_on:
      redis: { condition: service_healthy }
      api-gateway: { condition: service_healthy }
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      API_BASE_URL: http://api-gateway:8080
      WORKER_TOKEN: ${WORKER_TOKEN}
    # Evidence is only ever written to tmpfs/volumes; the image itself is immutable at runtime.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - worker-work:/work
      - vol-cache:/cache
    deploy:
      resources:
        limits: { cpus: "2", memory: 4g }
    # `egress` lets Volatility fetch Windows PDB symbols; drop it if you bake symbols (VOL_SYMBOLS=windows).
    networks: [backend, egress]

  frontend:
    build: ./frontend
    image: forensics/frontend:local
    <<: *hardening
    depends_on: [api-gateway]
    environment:
      API_UPSTREAM: api-gateway:8080
    ports:
      - "3000:8080"
    networks: [frontend]

volumes:
  uploads:
  worker-work:
  vol-cache:

networks:
  frontend:
  egress:
  backend:
    internal: true   # Redis and the worker's API traffic never leave this network
