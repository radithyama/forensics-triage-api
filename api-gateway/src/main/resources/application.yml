server:
  # Cloud Run injects PORT.
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-gateway
  web:
    error:
      include-message: always
      include-binding-errors: always
  codec:
    # API bodies are tiny JSON documents; refuse anything bigger before it is buffered.
    max-in-memory-size: 16KB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

triage:
  project-id: ${GOOGLE_CLOUD_PROJECT:}
  bucket: ${EVIDENCE_BUCKET:}
  topic: ${JOBS_TOPIC:forensic-jobs}
  upload-url-ttl: ${UPLOAD_URL_TTL:5m}
  # Enforced by GCS itself via the signed x-goog-content-length-range header. The 6 GB ceiling
  # matches what the 8 GiB worker can hold in its in-memory /tmp.
  min-upload-size: ${MIN_UPLOAD_SIZE:10MB}
  max-upload-size: ${MAX_UPLOAD_SIZE:6GB}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  # Access code: read once at startup from Secret Manager (production) or given directly (local dev only).
  api-key-secret: ${API_KEY_SECRET:}
  api-key: ${API_KEY:}
  allowed-plugins:
    - windows.pslist.PsList
    - windows.pstree.PsTree
    - windows.cmdline.CmdLine
    - windows.netscan.NetScan
    - windows.malfind.Malfind
    - linux.pslist.PsList
