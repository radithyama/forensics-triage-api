# Default-deny ingress, then allow only the flows the architecture needs:
#   internet -> frontend -> api-gateway <- forensic-worker
#                               |               |
#                               +---> redis <---+
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: forensics }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: frontend-from-anywhere, namespace: forensics }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: frontend } }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: api-gateway-from-frontend-and-worker, namespace: forensics }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: api-gateway } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: frontend } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: forensic-worker } }
      ports: [{ port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: redis-from-backend, namespace: forensics }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: redis } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: api-gateway } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: forensic-worker } }
      ports: [{ port: 6379 }]
