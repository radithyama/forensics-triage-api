apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: forensics
  labels: { app.kubernetes.io/name: api-gateway, app.kubernetes.io/part-of: forensics-triage }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: api-gateway }
  ports:
    - { name: http, port: 8080, targetPort: http }
