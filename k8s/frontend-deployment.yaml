apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: forensics
  labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: forensics-triage }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: frontend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: forensics-triage }
    spec:
      automountServiceAccountToken: false
      # Docker-link style env vars (e.g. REDIS_PORT=tcp://...) would clobber our REDIS_PORT config.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: IMAGE_REGISTRY/frontend:IMAGE_TAG
          env:
            - { name: API_UPSTREAM, value: "api-gateway:8080" }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            # nginx renders its config template here at startup, and needs /tmp for pid + buffers.
            - { name: conf, mountPath: /etc/nginx/conf.d }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: conf
          emptyDir: { sizeLimit: 1Mi }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
