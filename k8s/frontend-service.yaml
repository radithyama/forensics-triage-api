apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: forensics
  labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: forensics-triage }
spec:
  type: LoadBalancer
  selector: { app.kubernetes.io/name: frontend }
  ports:
    - { name: http, port: 80, targetPort: http }
